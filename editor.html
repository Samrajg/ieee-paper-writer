<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - IEEE Paper Writer</title>
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <header class="editor-header">
        <div class="logo">IEEE Paper Writer</div>
        <div class="paper-title">Untitled Paper</div>
        <div class="header-actions">
            <span class="status">Saved</span>
            <button class="btn btn-secondary" id="previewBtn">Preview</button>
            <button class="btn btn-primary" id="downloadBtn">Download</button>
        </div>
    </header>

    <main class="editor-workspace">
        <aside class="paper-sidebar">
            <h2>Paper Structure</h2>
            <nav class="paper-section-list">
                <button class="section-item active" data-section="title">Title</button>
                <button class="section-item" data-section="authors">Authors</button>
                <button class="section-item" data-section="abstract">Abstract</button>
                <button class="section-item" data-section="keywords">Keywords</button>
                <button class="section-item" data-section="introduction">Introduction</button>
                <button class="section-item" data-section="related-work">Related Work</button>
                <button class="section-item" data-section="methodology">Methodology</button>
                <button class="section-item" data-section="results">Results</button>
                <button class="section-item" data-section="discussion">Discussion</button>
                <button class="section-item" data-section="conclusion">Conclusion</button>
                <button class="section-item" data-section="references">References</button>
            </nav>
        </aside>

        <section class="field-editor">
            <header class="field-header">
                <h2>Paper Information</h2>
            </header>
            <div class="editor-content">
                <h3 id="currentSectionTitle">Title</h3>
                
                <div class="form-group" id="regularFormGroup1">
                    <label for="fieldInput1" id="fieldLabel1">Paper Title</label>
                    <input type="text" id="fieldInput1" class="form-control" placeholder="Enter your IEEE paper title...">
                </div>

                <div class="form-group" id="regularFormGroup2">
                    <label for="fieldInput2" id="fieldLabel2">Short Description</label>
                    <textarea id="fieldInput2" class="form-control" rows="10" placeholder="Enter a short description of your paper..."></textarea>
                </div>

                <div class="authors-editor-container" id="authorsEditor" style="display: none;">
                    <div id="authorList">
                        <!-- Author inputs will be dynamically inserted here -->
                    </div>
                    <button class="btn btn-secondary" id="addAuthorBtn" style="margin-top: 1rem;">+ Add Author</button>
                </div>

                <div class="references-editor-container" id="referencesEditor" style="display: none;">
                    <div id="referenceList">
                        <!-- Reference inputs will be dynamically inserted here -->
                    </div>
                    <button class="btn btn-secondary" id="addReferenceBtn" style="margin-top: 1rem;">+ Add Reference</button>
                </div>


            </div>
        </section>

        <aside class="preview-panel">
            <header class="preview-header">
                <h2>Document Preview</h2>
            </header>
            <div class="preview-content-wrapper">
                <div class="visual-preview" id="visualPreview">
                    <!-- Visual mock of paper will be generated here -->
                </div>
            </div>
        </aside>
    </main>

    <script src="js/editor.js"></script>
</body>
</html>
